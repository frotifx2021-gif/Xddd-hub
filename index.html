<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xddd Hub Pro</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { background: #020617; color: #f1f5f9; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #00008B; padding: 10px; text-align: center; border-bottom: 2px solid #38bdf8; }
        h1 { margin: 0; font-size: 18px; color: #38bdf8; }
        .editor-box { flex-grow: 1; position: relative; padding: 10px; background: #000; }
        textarea { width: 100%; height: 100%; background: transparent; color: #38bdf8; border: none; outline: none; font-family: monospace; font-size: 15px; caret-color: #fff; resize: none; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px; background: #020617; }
        button { padding: 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .btn-inject { background: #1e40af; color: white; }
        .btn-execute { background: #38bdf8; color: #020617; }
    </style>
</head>
<body>
    <header><h1>xddd HUB PRO</h1></header>
    <div class="editor-box">
        <textarea id="editor" spellcheck="false" placeholder="-- Escribe tu script aquí..."></textarea>
    </div>
    <div class="controls">
        <button class="btn-inject" onclick="alert('Inyectando...')">INJECT</button>
        <button class="btn-execute" onclick="alert('Ejecutado')">EXECUTE</button>
    </div>
    <script>
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
    </script>
</body>
</html>
